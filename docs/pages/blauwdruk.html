<title>Tinkpop Blauwdruk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky tabbalk; Overzicht = muur van 50 sites; Goedkeuren = lijst met 3-standen-knoppen per punt; Audit; Vragen. Donker-eerst zoals het logo. */
:root{
  --bg:#0f1014; --surface:#181a21; --raised:#20232c; --fg:#f2f3f7; --muted:#9a9fb0; --line:#2d313d;
  --cyan:#22c3ff; --pink:#ff3fb4; --orange:#ff9a1f; --accent:#22c3ff; --accent-ink:#06121a;
  --good:#3ddc84; --warn:#ffb224; --bad:#ff5c6c;
  --grad:linear-gradient(90deg,var(--cyan),var(--pink) 55%,var(--orange));
  --display:"Fredoka","Nunito","Avenir Next",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f6f6f9; --surface:#ffffff; --raised:#f0f1f5; --fg:#15161b; --muted:#5d6273; --line:#dcdee6;
  --cyan:#0089c7; --pink:#c8147f; --orange:#c96500; --accent:#0071b8; --accent-ink:#ffffff;
  --good:#16804a; --warn:#9a6100; --bad:#c02c3d; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f6f6f9; --surface:#ffffff; --raised:#f0f1f5; --fg:#15161b; --muted:#5d6273; --line:#dcdee6;
  --cyan:#0089c7; --pink:#c8147f; --orange:#c96500; --accent:#0071b8; --accent-ink:#ffffff;
  --good:#16804a; --warn:#9a6100; --bad:#c02c3d; color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.logo{font:700 22px var(--display)}
.logo b{font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{font:500 13px var(--mono);color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
nav.tabs button{font:600 14px var(--body);color:var(--muted);background:none;border:0;padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);background:var(--raised)}
nav.tabs .hot{color:var(--pink)}
.pill{font:600 12px var(--mono);padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--good);border-color:currentColor}
main{padding-block:28px 72px}
section.tab{display:grid;gap:22px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:clamp(2.1rem,6vw,3.4rem);line-height:1.04;font-weight:700}
h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:1.5rem;font-weight:600}
h3{font-size:1.08rem;font-weight:600}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.eyebrow{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--cyan)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:12px;min-width:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.kpi{display:grid;gap:2px}
.kpi b{font:700 28px var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
ul,ol{margin:0;padding-left:1.2em;display:grid;gap:6px}
li{max-width:70ch}
.btn{font:600 14px var(--body);padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* sites */
.cats{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.site{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line)}
.site:first-of-type{border-top:0}
.site b{font-size:14.5px}
.site span{grid-column:2;font-size:13.5px;color:var(--muted)}
.site i{grid-row:span 2;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--c)}
/* items */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 13px var(--body);padding:6px 11px;border-radius:99px;border:1.5px solid var(--line);background:var(--raised);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan)}
.it{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.it .id{font:700 13px var(--mono);color:var(--muted)}
.it .t{font-weight:600;font-size:15px}
.it .s{font-size:13px;color:var(--muted);margin-top:2px}
.it .s em{font-style:normal;color:var(--orange)}
.tri{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.tri button{font:700 13px var(--body);padding:8px 10px;background:var(--raised);color:var(--muted);border:0;cursor:pointer;min-width:42px}
.tri button+button{border-left:1.5px solid var(--line)}
.tri button[aria-pressed="true"][data-v="ok"]{background:var(--good);color:#07140c}
.tri button[aria-pressed="true"][data-v="later"]{background:var(--warn);color:#1a1100}
.tri button[aria-pressed="true"][data-v="no"]{background:var(--bad);color:#1a0508}
.rec{font:600 10.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:5px;border:1px solid currentColor;margin-left:6px;vertical-align:1px}
.rec.ok{color:var(--good)} .rec.later{color:var(--warn)} .rec.no{color:var(--bad)} .rec.ask{color:var(--pink)}
.ph{font:600 11px var(--mono);color:var(--cyan);margin-left:6px}
.list{display:grid;gap:8px}
@media (max-width:620px){.it{grid-template-columns:1fr;gap:8px}.it .id{display:none}.tri{justify-self:start}}
/* audit */
details{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;gap:10px;align-items:baseline}
details>summary::-webkit-details-marker{display:none}
details>div{padding:0 16px 16px;display:grid;gap:8px}
.sev{font:700 11px var(--mono);padding:2px 8px;border-radius:99px;border:1.5px solid currentColor;text-transform:uppercase;white-space:nowrap}
.sev.blocker{color:var(--bad)} .sev.high{color:var(--orange)} .sev.medium{color:var(--warn)} .sev.low{color:var(--muted)}
.score{display:grid;grid-template-columns:minmax(140px,220px) 1fr 34px;gap:10px;align-items:center;font-size:14px}
.score .track{height:10px;background:var(--raised);border-radius:5px;overflow:hidden}
.score .fill{height:100%;background:var(--grad)}
.score b{font:600 13px var(--mono);text-align:right}
/* vragen */
.qq{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px}
.qq .why{font-size:14px;color:var(--muted)}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;text-align:left;padding:11px 13px;border-radius:11px;border:1.5px solid var(--line);background:var(--raised);color:var(--fg);cursor:pointer;font:inherit}
.opt .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);margin-top:3px}
.opt[aria-pressed="true"]{border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 12%,var(--raised))}
.opt[aria-pressed="true"] .dot{border-color:var(--cyan);background:var(--cyan)}
.opt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.adv{font:600 11px var(--mono);color:var(--good);margin-left:6px}
textarea{width:100%;min-height:64px;font:15px/1.5 var(--body);color:var(--fg);background:var(--raised);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
.progress{height:6px;background:var(--raised);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--grad);transition:width .3s}
.btn:focus-visible,.chip:focus-visible,.tri button:focus-visible,.opt:focus-visible,nav.tabs button:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--cyan) 55%,transparent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</div></header>

const AUDIT={"intro": "Een onafhankelijke controleur las alle documenten en de 50-sites-blauwdruk, en keek naar zestien gebieden. Oordeel: het concept staat, maar het is nog niet klaar om te lanceren. Je ging vier keer tegen het advies in (inloggen vanaf dag één, klik = live, geen testgroep, eigen font); dat mag, maar dan moeten de vangnetten erbij. Die staan nu als groep I bij Goedkeuren.", "scores": [["Product", 2], ["Gebruiksgemak", 3], ["Toegankelijkheid", 1], ["Architectuur", 3], ["Snelheid", 2], ["Beveiliging", 1], ["Privacy en recht", 1], ["Licenties", 2], ["Community", 2], ["Groei en vindbaarheid", 2], ["Merk", 2], ["Geld", 3], ["Beheer en vervanging", 1], ["Afhankelijkheden", 3], ["Focus", 1], ["Risico voor jou als eigenaar", 1]], "top": [["blocker", "Inloggen vanaf dag één zonder plan", "Er staat nog niets over hoe inloggen veilig wordt: bibliotheek, sessies, limieten. En met inloggen geldt de AVG meteen volledig.", "Onderhouden inlogbibliotheek met e-maillink + passkey, veilige cookies, limieten. Beheer alleen via Cloudflare Access. AVG-pakket klaar vóór livegang (privacyverklaring, register, verwerkersovereenkomsten, bewaartermijn, exporteren/verwijderen, datalek-procedure)."], ["blocker", "'Klik = live' kan de site duur en kwetsbaar maken", "Als elke pagina bij Cloudflare de schakelaars opvraagt, verlies je de gratis statische site en loop je tegen de limiet van 100.000 per dag. En het bord kan iets aanzetten waarvan een onderdeel ontbreekt.", "Schakelaars in één bestand dat de browser elke minuut ophaalt. Het bord zet alleen geteste modules aan/uit, controleert afhankelijkheden, vraagt 2× bevestiging, logt alles, toont 10 minuten een ongedaan-knop en heeft een veilige stand. Nieuwe code blijft via voorstel + proeflink."], ["blocker", "Jij keurt voorstellen goed die je niet kunt lezen", "Een AI-samenvatting kan worden misleid door tekst in het voorstel zelf.", "De samenvatting is alleen advies. De echte poorten zijn automatisch: alleen de eigen map, alleen .scad, geen nieuwe pakketten, render + plaatje, en jij test de proeflink."], ["blocker", "Alles hangt aan jou", "Als jij uitvalt of je account kwijt raakt, ligt alles stil.", "Draaiboek van één pagina, overzicht waar de geheimen staan, domein automatisch verlengen, passkeys op GitHub/Cloudflare/e-mail, herstelcodes in een envelop bij iemand die je vertrouwt."], ["high", "Een naamsleutelhanger alleen onderscheidt niet", "Er zijn er al vijf goede, waaronder MakerWorld zelf.", "Plaat vullen (H1) en 25 namen tegelijk (H2) naar fase 1; de clicker als tweede generator."], ["high", "Inloggen mag downloaden nooit blokkeren", "Een inlogmuur jaagt bijna iedereen weg.", "Downloaden zonder account; inloggen in fase 1 alleen voor bewaren in de cloud."], ["high", "Licentie van gemaakte bestanden", "CC BY op elke gemaakte sleutelhanger betekent dat iedere verkoper credit moet geven.", "Generator CC BY 4.0, gemaakte bestanden vrij. Alleen vrije licenties (geen NC/ND). Twemoji in plaats van OpenMoji."], ["high", "Plakken uit MakerWorld nodigt uit tot licentiewitwassen", "De standaardlicentie op MakerWorld is niet open.", "H9 uitstellen tot er bewijs van de echte maker gevraagd wordt."], ["high", "SVG en eigen fonts zijn onveilige bestanden", "Een SVG kan code bevatten; een font is een binair bestand.", "SVG: alleen de vormen eruit halen. Font: alleen in je browser, max. 8 MB, nooit bewaard of gedeeld."], ["high", "Telefoon is 4–6× trager dan de meting", "117 ms op een laptop wordt 500–700 ms op een goedkope Android.", "Testtelefoon benoemen en meten in fase 0; eerst een ruwe vorm; .scad-presets max. 2 s."], ["high", "Pinkpop is één letter verschil", "Bekende merken zijn ook buiten hun eigen categorie beschermd. Zelf zoeken in TMview is niet genoeg.", "Een half uur bij een merkenjurist (± €150), daarna registreren bij BOIP (vanaf ± €250)."], ["high", "Geen testgroep + inloggen + klik = live stapelt het risico", "Fouten komen dan pas aan het licht als er veel bezoekers zijn.", "St
