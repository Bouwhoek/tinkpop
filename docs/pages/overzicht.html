<title>Tinkpop Overzicht</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky tabs; Modules = bord met kolommen per fase + detailpaneel; Reflecties = drie rondes (Gemini, GPT, Claude). Donker-eerst zoals het logo. */
:root{
  --bg:#0f1014; --surface:#181a21; --raised:#20232c; --fg:#f2f3f7; --muted:#9a9fb0; --line:#2d313d;
  --cyan:#22c3ff; --pink:#ff3fb4; --orange:#ff9a1f; --accent:#22c3ff; --accent-ink:#06121a;
  --good:#3ddc84; --warn:#ffb224; --bad:#ff5c6c;
  --grad:linear-gradient(90deg,var(--cyan),var(--pink) 55%,var(--orange));
  --display:"Fredoka","Nunito","Avenir Next",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f6f6f9; --surface:#ffffff; --raised:#f0f1f5; --fg:#15161b; --muted:#5d6273; --line:#dcdee6;
  --cyan:#0089c7; --pink:#c8147f; --orange:#c96500; --accent:#0071b8; --accent-ink:#ffffff;
  --good:#16804a; --warn:#9a6100; --bad:#c02c3d; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f6f6f9; --surface:#ffffff; --raised:#f0f1f5; --fg:#15161b; --muted:#5d6273; --line:#dcdee6;
  --cyan:#0089c7; --pink:#c8147f; --orange:#c96500; --accent:#0071b8; --accent-ink:#ffffff;
  --good:#16804a; --warn:#9a6100; --bad:#c02c3d; color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.logo{font:700 22px var(--display)} .logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent} .logo small{font:500 13px var(--mono);color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;flex:1 1 640px;min-width:0;scrollbar-width:none;order:3}
@media (min-width:1500px){nav.tabs{order:0}}
nav.tabs button{font:600 14px var(--body);color:var(--muted);background:none;border:0;padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);background:var(--raised)}
nav.tabs .hot{color:var(--pink)}
.pill{font:600 12px var(--mono);padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--good);border-color:currentColor}
main{padding-block:28px 72px}
section.tab{display:grid;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:clamp(2rem,6vw,3.3rem);line-height:1.04;font-weight:700} h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:1.45rem;font-weight:600} h3{font-size:1.06rem;font-weight:600}
p{margin:0;max-width:70ch}
.muted{color:var(--muted)}
.eyebrow{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--cyan)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:12px;min-width:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.kpi b{font:700 30px var(--display);display:block;line-height:1.1;font-variant-numeric:tabular-nums} .kpi span{font-size:13px;color:var(--muted)}
ul,ol{margin:0;padding-left:1.2em;display:grid;gap:6px} li{max-width:72ch}
.btn{font:600 14px var(--body);padding:10px 15px;border-radius:12px;border:1px solid var(--line);background:var(--raised);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.grad{background:var(--grad);color:#0b0b10;border:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 13px var(--body);padding:6px 11px;border-radius:99px;border:1.5px solid var(--line);background:var(--raised);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan)}
.tag{font:700 10.5px var(--mono);padding:1px 7px;border-radius:99px;border:1.5px solid currentColor;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.st-besloten{color:var(--cyan)} .st-goedgekeurd{color:var(--good)} .st-open{color:var(--orange)} .st-later{color:var(--muted)}
/* bord */
.bwrap{display:grid;grid-template-columns:1fr;gap:14px}
.bscroll{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface);background-image:radial-gradient(var(--line) 1px,transparent 1.3px);background-size:20px 20px}
.board{position:relative;display:grid;grid-template-columns:repeat(6,minmax(170px,1fr));gap:26px;padding:20px;min-width:1150px}
.board svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.col{display:grid;align-content:start;gap:10px;position:relative;z-index:1}
.col h3{font:600 11.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.node{background:var(--raised);border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;display:grid;gap:4px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.node .t{font-weight:700;font-size:13.5px;line-height:1.25}
.node .m{display:flex;flex-wrap:wrap;gap:4px}
.node[data-g="kern"]{border-color:color-mix(in srgb,var(--pink) 70%,var(--line))}
.node[data-g="generator"]{border-color:color-mix(in srgb,var(--orange) 70%,var(--line))}
.node.sel{outline:2px solid var(--cyan);outline-offset:2px}
.node.dim{opacity:.3}
.node.hl{outline:2px dashed var(--orange);outline-offset:2px}
.fl{font:600 10px var(--mono);color:var(--muted);background:var(--surface);border-radius:4px;padding:1px 5px}
.detail{position:sticky;top:76px;align-self:start;align-content:start;max-height:calc(100vh - 96px);overflow:auto}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:2px solid}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:720px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lvl{font:700 11px var(--mono);white-space:nowrap}
.lvl.asis{color:var(--good)} .lvl.adapt{color:var(--cyan)} .lvl.insp{color:var(--warn)} .lvl.self{color:var(--pink)}
.flow{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.step{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px}
.step b{font:600 12px var(--mono);color:var(--pink)}
/* reflecties */
.round{border:2px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px;background:var(--surface)}
.round.done{border-color:var(--good)}
.round .who{font:700 20px var(--display)}
.prompt{white-space:pre-wrap;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:12px;font:12.5px/1.55 var(--mono);max-height:220px;overflow:auto}
textarea{width:100%;min-height:150px;font:15px/1.55 var(--body);color:var(--fg);background:var(--raised);border:1.5px solid var(--line);border-radius:12px;padding:12px;resize:vertical}
.reflect{white-space:pre-wrap;background:var(--raised);border-left:4px solid var(--cyan);border-radius:10px;padding:12px 14px;font-size:15px}
.qq{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;text-align:left;padding:11px 13px;border-radius:11px;border:1.5px solid var(--line);background:var(--raised);color:var(--fg);cursor:pointer;font:inherit}
.opt .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);margin-top:3px}
.opt[aria-pressed="true"]{border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 12%,var(--raised))}
.opt[aria-pressed="true"] .dot{border-color:var(--cyan);background:var(--cyan)}
.opt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.adv{font:600 11px var(--mono);color:var(--good);margin-left:6px}
.btn:focus-visible,.chip:focus-visible,.node:focus-visible,.opt:focus-visible,nav.tabs button:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--cyan) 55%,transparent);outline-offset:2px}
/* indeling */
.layers{display:grid;gap:16px}
.layer{display:grid;gap:10px}
.layer>h3{font:600 12px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.areas{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.area{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:grid;align-content:start}
.area .bar{height:6px;background:var(--ac)}
.area .hd{padding:14px 16px 6px;display:grid;gap:4px}
.area .hd h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.area .code{font:600 12px var(--mono);color:var(--ac)}
.area .hd p{font-size:13.5px;color:var(--muted)}
.subs{display:grid;padding:6px 8px 10px}
.sub{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;text-align:left;padding:8px 8px;border-radius:10px;border:0;background:none;color:var(--fg);font:inherit;cursor:pointer}
.sub:hover,.sub.sel{background:var(--raised)}
.sub b{font-size:14px;font-weight:600}
.sub code{grid-column:1;font:11.5px var(--mono);color:var(--muted)}
.sub .ph{grid-row:1 / span 2;grid-column:2;font:700 11px var(--mono);padding:2px 7px;border-radius:6px;background:var(--raised);color:var(--muted)}
.sub .ph.p0,.sub .ph.p1{color:var(--accent-ink);background:var(--cyan)}
#idet{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:4;box-shadow:0 12px 40px rgba(0,0,0,.35);max-height:46vh;overflow:auto;gap:8px}
@media (min-width:1000px){.bwrap{grid-template-columns:minmax(0,1fr) 300px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</div></header>

const PLAN={"one": "Tinkpop is een gratis, open website waar je in je browser 3D-printbare dingen maakt: typ een naam, zie hem meteen in 3D, en download een bestand met de juiste kleuren voor je printer. Eerst sleutelhangers (ook een hele plaat met namen in één keer), daarna een clicker en meer. Alles is modulair, legaal by design, en heeft één herkenbaar gevoel: de pop.", "blocks": [["Voor wie", ["Bambu-bezitters die snel iets willen printen", "Groepen: klassen, teams, clubs, feesten, Etsy-verkopers", "Later: ontwerpers die eigen generators bijdragen"]], ["De belofte", ["Gratis, open, geen advertenties, geen data verkopen", "Downloaden zonder account; inloggen alleen om te bewaren", "Rekent in je browser: geen wachtrij, geen timeout"]], ["Waarmee we winnen", ["Hele plaat met namen in één keer, gratis, op je telefoon", "3MF die meteen goed in de AMS valt", "Snel en betrouwbaar, elke generator echt geprint", "Bereik via Bouwhoek, NotMadeYet en MakerWorld"]], ["Hoe het gebouwd wordt", ["Astro + React op Cloudflare Workers (€0)", "Rekenmotor manifold in de browser; community in OpenSCAD", "Elk onderdeel een module met kaartje en juridisch blok", "Modulebord: geteste modules aan/uit, met logboek en ongedaan maken"]], ["Legaal en veilig", ["Juridische poort: bouw faalt als licentie of herkomst niet klopt", "AVG-pakket en meldknop vóór inloggen live gaat", "Rode lijnen: geen reclame, geen tracking, niets verkopen via Tinkpop", "Snel herstellen: contactpunt, 48 uur, openbaar logboek"]], ["Het gevoel", ["Pop-taal: pop-in, plop-out, feestje bij downloaden", "Geluid standaard uit, 'rustig'-stand voor wie beweging niet fijn vindt", "Kalender met gelegenheden, geen dark patterns"]]], "gonogo": "Na de proefweek bouwen, twee weken stil live, dan aankondigen. Vier weken later meten: doorgaan bij ≥ 500 downloads, ≥ 20% via batch of plaat vullen, en ≥ 10% van de bezoekers komt binnen een maand terug. Anders: Tinkpop houden als gratis tool bij Bouwhoek en niet verder uitbreiden.", "phases": [["Fase 0 · proefweek", "Naam op een plaat, 3 fonts, kleuren-3MF, proeflink; getest op jouw Android en een geleende iPhone, en in Bambu Studio"], ["Fase 1 · lancering", "Alles erop en eraan, plaat vullen, batch, inloggen met AVG-pakket, meldknop, stille lancering 2 weken"], ["Fase 2 · beheer & groei", "Modulebord, live schakelaars, clicker, catalogus, gelegenheden"], ["Fase 3 · community", "OpenSCAD-spoor, meebouwen (na 3 maanden live), profielen, remix, picks"], ["Fase 4 · uitbreiden", "Makes-foto's, Nederlands, Open in Bambu Studio"], ["Fase 5 · later", "AI, klasmodus, Not Made Yet-brug: alleen als het gedragen wordt"]], "docs": [["bible.md", "het bouwplan"], ["blauwdruk.md", "het beste van 50 sites, goedgekeurd"], ["juridisch.md", "mag het? en de checklist"], ["risicos.md", "41 risico's"], ["gevoel.md", "onderscheiden, terugkomen, iedereen tevreden"], ["brand/pop.md", "de pop-taal"], ["besluiten.md", "alle besluiten met reden"], ["roadmap.md", "open vragen"]], "text": "Tinkpop is een gratis, open website waar je in je browser 3D-printbare dingen maakt: typ een naam, zie hem meteen in 3D, en download een bestand met de juiste kleuren voor je printer. Eerst sleutelhangers (ook een hele plaat met namen in één keer), daarna een clicker en meer. Alles is modulair, legaal by design, en heeft één herkenbaar gevoel: de pop.\n\nVoor wie: Bambu-bezitters die snel iets willen printen; Groepen: klassen, teams, clubs, feesten, Etsy-verkopers; Later: ontwerpers die eigen generators bijdragen\nDe belofte: Gratis, open, geen advertenties, geen data verkopen; Downloaden zonder account; inloggen alleen om te bewaren; Rekent in je browser: geen wachtrij, geen timeout\nWaarmee we winnen: Hele plaat met namen in één keer, gratis, op je telefoon; 3MF die meteen goed in de AMS valt; Snel en betrouwbaar, elke generator echt geprint; Bereik via Bouwhoek, NotMadeYet en MakerWorld\nHoe het gebouwd wordt: Astro + React op Cloudflare Workers (€0); Rekenmotor manifold in de browser; community in OpenSCAD; Elk onderdeel een module met kaartje en juridisch blok; Modulebord: geteste modules aan/uit, met logboek en ongedaan maken\nLegaal en veilig: Juridische poort: bouw faalt als licentie of herkomst niet klopt; AVG-pakket en meldknop vóór inloggen live gaat; Rode lijnen: geen reclame, geen tracking, niets verkopen via Tinkpop; Snel herstellen: contactpunt, 48 uur, openbaar logboek\nHet gevoel: Pop-taal: pop-in, plop-out, feestje bij downloaden; Geluid standaard uit, 'rustig'-stand voor wie beweging niet fijn vindt; Kalender met gelegenheden, geen dark patterns\n\nFasen: Fase 0 · proefweek: Naam op een plaat, 3 fonts, kleuren-3MF, proeflink; getest op jouw Android en een geleende iPhone, en in Bambu Studio | Fase 1 · lancering: Alles erop en eraan, plaat vullen, batch, inloggen met AVG-pakket, meldknop, stille lancering 2 weken | Fase 2 · beheer & groei: Modulebord, live schakelaars, clicker, catalogus, gelegenheden | Fase 3 · community: OpenSCAD-spoor, meebouwen (na 3 maanden live), profielen, remix, picks | Fase 4 · uitbreiden: Makes-foto's, Nederlands, Open in Bambu Studio | Fase 5 · later: AI, klasmodus, Not Made Yet-brug: alleen als het gedragen wordt\n\nDoorgaan of stoppen: Na de proefweek bouwen, twee weken stil live, dan aankondigen. Vier weken later meten: doorgaan bij ≥ 500 downloads, ≥ 20% via batch of plaat vullen, en ≥ 10% van de bezoekers komt binnen een maand terug. Anders: Tinkpop houden als gratis tool bij Bouwhoek en niet verder uitbreiden.\n\nConcurrentie: MakerWorld Parametric Model Maker (±10M gebruikers/maand, rekent op server, timeouts), KeychainGEN (batch + plaat vullen, gratis tot 11/2026), keychaingenerator.tech, Open Keychain (MIT), Tagify3D (MIT), 3dprint.name en Keyform (betaald), PrintPal (betaalde clicker). Minstens 7 nieuwe keychain-sites in 2026.\n\nBesluiten eigenaar: inloggen vanaf begin (alleen bewaren, e-maillink + passkey, 16+), downloaden nooit achter login, community alleen .scad na 3 maanden, stille lancering, één project tegelijk, alles gratis met alleen Buy Me a Coffee, gemaakte bestanden vrij, generator CC BY 4.0, code MIT (AGPL in overweging).\n\nOpen-source basis: Rekenkern (vormen, tekst-contour, gram): manifold-3d (Apache-2.0); Rekenwerker + cache: open-keychain (worker, cache) (MIT); OpenSCAD in de browser: openscad-wasm (los, geïsoleerd) (GPL-2.0+); Customizer-paneel: openscad-playground (GPL-3.0); 3D-voorbeeld: three + react-three-fiber + drei (MIT); Wanddikte-check: three-mesh-bvh (MIT); Tekst naar vorm: harfbuzzjs + outline.ts (open-keychain) (MIT); Fonts: google/fonts (OFL / Apache); SVG naar vorm: three SVGLoader (MIT); Foto naar vector (later): imagetracerjs (Unlicense); Emoji: Twemoji (jdecked) (MIT + CC BY 4.0); 3MF voor Bambu (AMS): three-3mf-exporter (bekuto3d) (MIT); Plaat vullen: maxrects-packer (MIT); Slicer-test in CI: PrusaSlicer CLI + open-keychain-scripts (AGPL (alleen tool) / MIT); OpenSCAD-bibliotheek: BOSL2 (BSD-2-Clause); Inloggen (e-maillink + passkey): Better Auth + passkey-plugin (MIT); Beheer-slot: Cloudflare Access (dienst); Inlogmails: Resend (gratis 100/dag) of Cloudflare Email ($5/mnd) (MIT (SDK)); Database: Drizzle ORM op D1 (Apache-2.0); Live schakelaars: eigen flags.json in OpenFeature-vorm (Apache-2.0 (vorm)); Modulebord: React Flow + dagre (MIT); Formulieren uit schema: rjsf + @cfworker/json-schema (Apache-2.0 / MIT); Meertalig: Astro i18n + Paraglide (MIT); Statistiek: Cloudflare Web Analytics + Analytics Engine (dienst); Foutmeldingen: @sentry/cloudflare → GlitchTip (MIT); Scheldwoordfilter (openbare delen): obscenity (MIT); Robotcheck: Turnstile + react-turnstile (MIT); Docs, logboek, transparantie: Astro Starlight + Changesets (MIT); CI-controles: ajv, dependency-review, license-checker, REUSE, Playwright + axe, Renovate (diverse (alleen tools)); Feestje bij download: canvas-confetti (of eigen canvas) (ISC); Meldknop + takedown (DSA): niets geschikt (—); Pop-taal: eigen (CSS + WAAPI) (—)"};
