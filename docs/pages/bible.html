<title>Tinkpop Bible</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky tabbalk; elk tabblad één werkvlak. Bord = kolommen per fase met SVG-lijnen. Donker-eerst, zoals het logo. */
:root{
  --bg:#0f1014; --surface:#181a21; --raised:#20232c; --fg:#f2f3f7; --muted:#9a9fb0; --line:#2d313d;
  --cyan:#22c3ff; --pink:#ff3fb4; --orange:#ff9a1f; --accent:#22c3ff; --accent-ink:#06121a;
  --good:#3ddc84; --warn:#ffb224; --bad:#ff5c6c;
  --grad:linear-gradient(90deg,var(--cyan),var(--pink) 55%,var(--orange));
  --display:"Fredoka","Nunito","Avenir Next",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f6f6f9; --surface:#ffffff; --raised:#f0f1f5; --fg:#15161b; --muted:#5d6273; --line:#dcdee6;
  --cyan:#0096d6; --pink:#d4178b; --orange:#d9700a; --accent:#0076c2; --accent-ink:#ffffff;
  --good:#18864b; --warn:#a86a00; --bad:#c62f40; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f6f6f9; --surface:#ffffff; --raised:#f0f1f5; --fg:#15161b; --muted:#5d6273; --line:#dcdee6;
  --cyan:#0096d6; --pink:#d4178b; --orange:#d9700a; --accent:#0076c2; --accent-ink:#ffffff;
  --good:#18864b; --warn:#a86a00; --bad:#c62f40; color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.logo{font:700 22px var(--display);letter-spacing:-.01em}
.logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
nav.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
nav.tabs button{font:600 14px var(--body);color:var(--muted);background:none;border:0;padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);background:var(--raised)}
nav.tabs .q{color:var(--pink)}
.pill{font:600 12px var(--mono);padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--good);border-color:currentColor}
main{padding-block:28px 72px}
section.tab{display:grid;gap:22px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.02;font-weight:700}
h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:1.55rem;font-weight:600}
h3{font-size:1.1rem;font-weight:600}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.eyebrow{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--cyan)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:12px;min-width:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.kpi{display:grid;gap:2px}
.kpi b{font:700 28px var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
ul,ol{margin:0;padding-left:1.2em;display:grid;gap:6px}
li{max-width:70ch}
code,.mono{font-family:var(--mono);font-size:13px}
pre{margin:0;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:14px;overflow-x:auto;font:12.5px/1.55 var(--mono)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:640px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
details{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;gap:10px;align-items:center}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"+";font:600 16px var(--mono);color:var(--cyan);width:1em}
details[open]>summary::before{content:"–"}
details>div{padding:0 16px 16px;display:grid;gap:10px}
.tag{display:inline-block;font:600 11px var(--mono);padding:2px 7px;border-radius:6px;background:var(--raised);color:var(--muted);border:1px solid var(--line)}
.sev{font:700 11px var(--mono);padding:2px 8px;border-radius:99px;border:1.5px solid currentColor;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.sev.blocker{color:var(--bad)} .sev.high{color:var(--orange)} .sev.medium{color:var(--warn)} .sev.low{color:var(--muted)}
/* bord */
.board-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:600 14px var(--body);padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.board-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface);background-image:radial-gradient(var(--line) 1px,transparent 1.3px);background-size:20px 20px}
.board{position:relative;display:grid;grid-template-columns:repeat(5,minmax(178px,1fr));gap:28px;padding:22px;min-width:1000px}
.board svg.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.col{display:grid;align-content:start;gap:12px}
.col h3{font:600 12px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.node{position:relative;background:var(--raised);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .15s,opacity .15s}
.node .t{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.node .d{font-size:12.5px;color:var(--muted);line-height:1.35}
.node .meta{display:flex;flex-wrap:wrap;gap:4px}
.node[data-on="1"]{border-color:var(--cyan);box-shadow:0 0 0 1px color-mix(in srgb,var(--cyan) 40%,transparent)}
.node[data-on="0"]{opacity:.55}
.node[data-core="1"]{border-style:solid;border-color:color-mix(in srgb,var(--pink) 70%,var(--line))}
.node.hl{outline:2px solid var(--orange);outline-offset:2px}
.sw{width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--fg);transition:transform .15s}
.node[data-on="1"] .sw{background:var(--cyan)}
.node[data-on="1"] .sw::after{transform:translateX(14px);background:var(--accent-ink)}
.node[data-core="1"] .sw{background:var(--pink)}
.node[data-core="1"] .sw::after{transform:translateX(14px)}
.meters{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.toast{min-height:22px;font-size:14px;color:var(--orange)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1.5px solid}
/* grafiek */
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;font-size:13.5px}
.bar .track{position:relative;height:14px;background:var(--raised);border-radius:7px;overflow:hidden}
.bar .fill{position:absolute;top:0;bottom:0;border-radius:7px}
.bar .v{font:600 12.5px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:560px){.bar{grid-template-columns:96px 1fr 70px}}
/* stappen */
.flow{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.step{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px}
.step b{font:600 12px var(--mono);color:var(--pink)}
/* vragen */
.qs{display:grid;gap:14px}
.qq{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px}
.qq .why{font-size:14px;color:var(--muted)}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;text-align:left;padding:11px 13px;border-radius:11px;border:1.5px solid var(--line);background:var(--raised);color:var(--fg);cursor:pointer;font:inherit}
.opt .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);margin-top:3px}
.opt[aria-pressed="true"]{border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 12%,var(--raised))}
.opt[aria-pressed="true"] .dot{border-color:var(--cyan);background:var(--cyan)}
.opt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.rec{font:600 11px var(--mono);color:var(--good);margin-left:6px}
textarea{width:100%;min-height:70px;font:15px/1.5 var(--body);color:var(--fg);background:var(--raised);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
.btn:focus-visible,.opt:focus-visible,.node:focus-visible,nav.tabs button:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--cyan) 55%,transparent);outline-offset:2px}
.progress{height:6px;background:var(--raised);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--grad);transition:width .3s}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top gut"><div class="wrap">
  <div class="logo">Tink<span>pop</span> <span class="muted" style="font:500 13px var(--mono);-webkit-text-fill-color:currentColor;background:none">bible v0.2</span></div>

function deps(id,acc=new Set()){(byId[id].req||[]).forEach(r=>{if(!acc.has(r)){acc.add(r);deps(r,acc)}});return acc}

function toggle(id){
  const m=byId[id];if(m.core){say(m.n+" is kern en staat altijd aan.");return}
  if(state.on[id]){
    const off=[...dependents(id)].filter(x=>state.on[x]&&!byId[x].core);
    state.on[id]=0;off.forEach(x=>state.on[x]=0);
    say(off.length?`${m.n} uit. Ook uit, want het hing ervan af: ${off.map(x=>byId[x].n).join(", ")}.`:`${m.n} uit.`);
  }else{
    const need=[...deps(id)].filter(x=>!state.on[x]);
    state.on[id]=1;need.forEach(x=>state.on[x]=1);
    say(need.length?`${m.n} aan. Ook aangezet, want het is nodig: ${need.map(x=>byId[x].n).join(", ")}.`:`${m.n} aan.`);
  }
  paintBoard();changed();

function drawWires(){

  }));

function changed(typing){try{localStorage.setItem("tp-bible",JSON.stringify(state))}catch(e){}clearTimeout(timer);timer=setTimeout(push,typing?1500:700)}
function summary(){
  const lines=["## Antwoorden"];QUESTIONS.forEach(q=>lines.push(`${q.id}: ${state.a[q.id]||"–"}${state.notes[q.id]?" | "+state.notes[q.id]:""}`));
  if(state.notes.vrij)lines.push("vrij: "+state.notes.vrij);
  lines.push("## Modules aan: "+MODULES.filter(m=>state.on[m.id]).map(m=>m.id).join(", "));
  return lines.join("\n");
}
async function push(){
  if(!db){saveEl.textContent="Alleen op dit apparaat";saveEl.className="pill";return false}
  saveEl.textContent="Opslaan…";
  try{await db.doc("bible/answers").set({a:state.a,notes:state.notes,on:state.on,samenvatting:summary(),bijgewerkt:new Date().toISOString()});
    saveEl.textContent="Opgeslagen "+new Date().toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});saveEl.className="pill ok";return true}
