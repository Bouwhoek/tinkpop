<style>
/* Layout: antwoord eerst (twee grote verdictkaarten), daarna tabbladen met details; heatmap als klikbaar raster. Donker-eerst zoals het logo. */
:root{
  --bg:#0f1014; --surface:#181a21; --raised:#20232c; --fg:#f2f3f7; --muted:#9a9fb0; --line:#2d313d;
  --cyan:#22c3ff; --pink:#ff3fb4; --orange:#ff9a1f; --accent:#22c3ff; --accent-ink:#06121a;
  --good:#3ddc84; --warn:#ffb224; --bad:#ff5c6c;
  --grad:linear-gradient(90deg,var(--cyan),var(--pink) 55%,var(--orange));
  --display:"Fredoka","Nunito","Avenir Next",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f6f6f9; --surface:#ffffff; --raised:#f0f1f5; --fg:#15161b; --muted:#5d6273; --line:#dcdee6;
  --cyan:#0089c7; --pink:#c8147f; --orange:#c96500; --accent:#0071b8; --accent-ink:#ffffff;
  --good:#16804a; --warn:#9a6100; --bad:#c02c3d; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f6f6f9; --surface:#ffffff; --raised:#f0f1f5; --fg:#15161b; --muted:#5d6273; --line:#dcdee6;
  --cyan:#0089c7; --pink:#c8147f; --orange:#c96500; --accent:#0071b8; --accent-ink:#ffffff;
  --good:#16804a; --warn:#9a6100; --bad:#c02c3d; color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1060px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.logo{font:700 22px var(--display)} .logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent} .logo small{font:500 13px var(--mono);color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
nav.tabs button{font:600 14px var(--body);color:var(--muted);background:none;border:0;padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);background:var(--raised)}
nav.tabs .hot{color:var(--pink)}
.pill{font:600 12px var(--mono);padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--good);border-color:currentColor}
main{padding-block:28px 72px}
section.tab{display:grid;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;font-weight:700}
h2{font-size:1.45rem;font-weight:600} h3{font-size:1.06rem;font-weight:600}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.eyebrow{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--cyan)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:12px;min-width:0}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.verdict{border-width:2px}
.verdict .big{font:700 clamp(1.6rem,4.5vw,2.3rem)/1.1 var(--display)}
.c-ok{color:var(--good)} .c-mits{color:var(--warn)} .c-no{color:var(--bad)}
.b-ok{border-color:var(--good)} .b-mits{border-color:var(--warn)} .b-no{border-color:var(--bad)}
.tag{font:700 11px var(--mono);padding:2px 8px;border-radius:99px;border:1.5px solid currentColor;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
ul,ol{margin:0;padding-left:1.2em;display:grid;gap:6px} li{max-width:70ch}
details{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details>summary{cursor:pointer;padding:13px 16px;font-weight:600;list-style:none;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
details>summary::-webkit-details-marker{display:none}
details>div{padding:0 16px 16px;display:grid;gap:8px}
.btn{font:600 14px var(--body);padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.scen{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.scbtn{text-align:left;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--raised);color:var(--fg);cursor:pointer;font:inherit;display:grid;gap:6px}
.scbtn[aria-pressed="true"]{border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 10%,var(--raised))}
.scbtn b{font-size:15px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.y{color:var(--good);font-weight:600} td.n{color:var(--bad);font-weight:600} td.g{color:var(--warn);font-weight:600}
.letter{white-space:pre-wrap;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14.5px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 13px var(--body);padding:6px 11px;border-radius:99px;border:1.5px solid var(--line);background:var(--raised);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan)}
/* heatmap */
.heat{display:grid;grid-template-columns:28px repeat(5,minmax(52px,1fr));gap:4px;max-width:620px}
.heat .ax{font:600 11px var(--mono);color:var(--muted);display:flex;align-items:center;justify-content:center}
.cell{min-height:58px;border-radius:8px;border:1px solid var(--line);padding:4px;display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start;cursor:pointer;background:var(--raised);font:inherit;color:var(--fg)}
.cell[data-s="hi"]{background:color-mix(in srgb,var(--bad) 28%,var(--raised))}
.cell[data-s="mid"]{background:color-mix(in srgb,var(--warn) 22%,var(--raised))}
.cell[data-s="lo"]{background:color-mix(in srgb,var(--good) 14%,var(--raised))}
.cell[aria-pressed="true"]{outline:2px solid var(--cyan);outline-offset:1px}
.cell span{font:700 10.5px var(--mono);padding:1px 4px;border-radius:4px;background:var(--surface)}
.rk{display:grid;grid-template-columns:48px 1fr auto;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);align-items:start}
.rk .id{font:700 13px var(--mono);color:var(--muted)}
.rk .sc{font:700 14px var(--mono)}
.st{font:600 11px var(--mono);color:var(--muted)} .st.gat{color:var(--bad)}
.list{display:grid;gap:8px}
/* checklist */
.chk{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;text-align:left;font:inherit;color:var(--fg);width:100%}
.chk .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--muted)}
.chk[aria-pressed="true"] .box{background:var(--good);border-color:var(--good)}
.chk[aria-pressed="true"] .tx{color:var(--muted);text-decoration:line-through}
.chk .cat{font:600 11px var(--mono);color:var(--cyan)}
/* vragen */
.qq{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;text-align:left;padding:11px 13px;border-radius:11px;border:1.5px solid var(--line);background:var(--raised);color:var(--fg);cursor:pointer;font:inherit}
.opt .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);margin-top:3px}
.opt[aria-pressed="true"]{border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 12%,var(--raised))}
.opt[aria-pressed="true"] .dot{border-color:var(--cyan);background:var(--cyan)}
.opt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.adv{font:600 11px var(--mono);color:var(--good);margin-left:6px}
textarea{width:100%;min-height:60px;font:15px/1.5 var(--body);color:var(--fg);background:var(--raised);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
.btn:focus-visible,.chip:focus-visible,.scbtn:focus-visible,.cell:focus-visible,.chk:focus-visible,.opt:focus-visible,nav.tabs button:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--cyan) 55%,transparent);outline-offset:2px}
.disc{font-size:13px;color:var(--muted);border-left:3px solid var(--warn);padding-left:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
