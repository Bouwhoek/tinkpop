<title>Tinkpop Gevoel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky tabs; tab "Pop" is een speeltuin met echte animaties; overige tabs kaarten + tabellen. Donker-eerst zoals het logo. */
:root{
  --bg:#0f1014; --surface:#181a21; --raised:#20232c; --fg:#f2f3f7; --muted:#9a9fb0; --line:#2d313d;
  --cyan:#22c3ff; --pink:#ff3fb4; --orange:#ff9a1f; --accent:#22c3ff; --accent-ink:#06121a;
  --good:#3ddc84; --warn:#ffb224; --bad:#ff5c6c;
  --grad:linear-gradient(90deg,var(--cyan),var(--pink) 55%,var(--orange));
  --display:"Fredoka","Nunito","Avenir Next",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f6f6f9; --surface:#ffffff; --raised:#f0f1f5; --fg:#15161b; --muted:#5d6273; --line:#dcdee6;
  --cyan:#0089c7; --pink:#c8147f; --orange:#c96500; --accent:#0071b8; --accent-ink:#ffffff;
  --good:#16804a; --warn:#9a6100; --bad:#c02c3d; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f6f6f9; --surface:#ffffff; --raised:#f0f1f5; --fg:#15161b; --muted:#5d6273; --line:#dcdee6;
  --cyan:#0089c7; --pink:#c8147f; --orange:#c96500; --accent:#0071b8; --accent-ink:#ffffff;
  --good:#16804a; --warn:#9a6100; --bad:#c02c3d; color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1060px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.logo{font:700 22px var(--display)} .logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent} .logo small{font:500 13px var(--mono);color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
nav.tabs button{font:600 14px var(--body);color:var(--muted);background:none;border:0;padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);background:var(--raised)}
nav.tabs .hot{color:var(--pink)}
.pill{font:600 12px var(--mono);padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--good);border-color:currentColor}
main{padding-block:28px 72px}
section.tab{display:grid;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:clamp(2rem,6vw,3.3rem);line-height:1.04;font-weight:700} h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:1.45rem;font-weight:600} h3{font-size:1.06rem;font-weight:600}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)}
.eyebrow{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--cyan)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:12px;min-width:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
ul,ol{margin:0;padding-left:1.2em;display:grid;gap:6px} li{max-width:70ch}
.btn{font:600 14px var(--body);padding:10px 15px;border-radius:12px;border:1px solid var(--line);background:var(--raised);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.grad{background:var(--grad);color:#0b0b10;border:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:680px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tag{font:700 11px var(--mono);padding:2px 8px;border-radius:99px;border:1.5px solid currentColor;text-transform:uppercase;white-space:nowrap}
.lo{color:var(--good)} .mi{color:var(--warn)} .hi{color:var(--bad)}
details{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details>summary{cursor:pointer;padding:13px 16px;font-weight:600;list-style:none;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
details>summary::-webkit-details-marker{display:none}
details>div{padding:0 16px 16px;display:grid;gap:8px}
.num{font:700 30px var(--display);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.diff{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
/* pop speeltuin */
.settings{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.sw{display:inline-flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;color:var(--fg);font:600 14px var(--body);padding:4px}
.sw .track{width:44px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw .knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--fg);transform:translateX(0)}
.sw[aria-checked="true"] .track{background:var(--cyan)}
.sw[aria-checked="true"] .knob{transform:translateX(20px);background:var(--accent-ink)}
.play{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.demo{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px;align-content:start;min-width:0}
.demo .nm{font:600 12px var(--mono);color:var(--pink)}
.stage{min-height:150px;border-radius:12px;background:var(--raised);background-image:radial-gradient(var(--line) 1px,transparent 1.3px);background-size:16px 16px;padding:14px;display:grid;gap:10px;align-content:start;position:relative;overflow:hidden}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;transform-origin:center}
.cat b{font-weight:600}
.x{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--raised);color:var(--fg);cursor:pointer;font:700 15px var(--body);display:grid;place-items:center;flex:none}
.model{height:110px;border-radius:12px;display:grid;place-items:center;position:relative;background:var(--surface)}
.model .tag3d{font:700 30px var(--display);padding:10px 22px;border-radius:14px;background:#26282a;color:#f4f4f0;letter-spacing:.02em;box-shadow:0 6px 0 #111}
.model .ring{position:absolute;inset:0;border-radius:12px;padding:2px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;pointer-events:none}
.dl{display:inline-flex;align-items:center;gap:8px}
.dl .ck{display:inline-block;opacity:0;transform:scale(0)}
input.field{font:16px var(--body);padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);width:100%}
input.field.err{border-color:var(--bad)}
.hint{font-size:13px;color:var(--muted);min-height:18px}
.hint.err{color:var(--bad)}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:60;width:min(92vw,380px)}
.toast{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 14px var(--body);padding:8px 13px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:grab;user-select:none;touch-action:none}
.counter{display:flex;align-items:center;gap:12px}
.counter .n{font:700 34px var(--display);min-width:2ch;text-align:center;font-variant-numeric:tabular-nums;display:inline-block}
.spec{font:12.5px/1.5 var(--mono);color:var(--muted)}
code{font-family:var(--mono);font-size:13px}
/* vragen */
.qq{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;text-align:left;padding:11px 13px;border-radius:11px;border:1.5px solid var(--line);background:var(--raised);color:var(--fg);cursor:pointer;font:inherit}
.opt .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);margin-top:3px}
.opt[aria-pressed="true"]{border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 12%,var(--raised))}
.opt[aria-pressed="true"] .dot{border-color:var(--cyan);background:var(--cyan)}
.opt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.adv{font:600 11px var(--mono);color:var(--good);margin-left:6px}
textarea{width:100%;min-height:60px;font:15px/1.5 var(--body);color:var(--fg);background:var(--raised);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
.btn:focus-visible,.x:focus-visible,.sw:focus-visible,.chip:focus-visible,.opt:focus-visible,nav.tabs button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid color-mix(in srgb,var(--cyan) 55%,transparent);outline-offset:2px}
.disc{font-size:13px;color:var(--muted);border-left:3px solid var(--warn);padding-left:10px}
</style>

<header class="top gut"><div class="wrap">
  <div class="logo">Tink<b>pop</b> <small>gevoel</small></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <span class="pill" id="save">Nog niets opgeslagen</span>
</div></header>
<main class="gut"><div class="wrap" id="views"></div></main>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
/* ===== Tinkpop Pop: motion-module (prototype) ===== */
const Pop=(()=>{
  const mq=matchMedia("(prefers-reduced-motion: reduce)");
  const S={sound:false,haptic:true,calm:mq.matches};
  try{const s=JSON.parse(localStorage.getItem("tp-pop-settings")||"null");if(s)Object.assign(S,s,{calm:s.calm||mq.matches})}catch(e){}
  const save=()=>{try{localStorage.setItem("tp-pop-settings",JSON.stringify(S))}catch(e){}};
  const amp=()=>S.calm?0:1;
  const E={std:"cubic-bezier(0.2,0,0,1)",out:"cubic-bezier(0.05,0.7,0.1,1)",inn:"cubic-bezier(0.3,0,0.8,0.15)",back:"cubic-bezier(0.34,1.56,0.64,1)"};
  const sc=(v)=>1+(v-1)*amp();
  /* geluid: Web Audio, standaard uit */
  let ac=null;
  function tone(type,f0,f1,glide,decay,peak=0.09,delay=0){
    if(!S.sound)return;
    try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();
      const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;
      o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+glide/1000);
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+(glide+decay)/1000);
      o.connect(g).connect(ac.destination);o.start(t);o.stop(t+(glide+decay)/1000+.02)}catch(e){}
  }
  const SND={pop:()=>tone("sine",500,1100,60,90),plop:()=>tone("sine",900,280,80,110),tink:()=>tone("triangle",1800,1790,5,50,.07),tick:()=>tone("triangle",1200,1250,5,30,.05),
    burst:()=>{tone("sine",520,1150,55,80);tone("sine",700,1500,55,90,.07,.08)}};
  const buzz=ms=>{if(S.haptic&&!S.calm&&navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}};
  const cancel=el=>el.getAnimations().forEach(a=>a.cancel());
  /* deeltjes: één canvas, alleen actief als er deeltjes leven */
  let cv=null,cx=null,parts=[],raf=0;
  function ensureCanvas(){if(cv)return;cv=document.createElement("canvas");cv.setAttribute("aria-hidden","true");cv.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50";document.body.append(cv);cx=cv.getContext("2d");resize();addEventListener("resize",resize)}
  function resize(){if(!cv)return;const d=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
  function emit(x,y,n,colors,opts={}){if(S.calm)return;ensureCanvas();for(let i=0;i<n;i++){const a=(opts.spread??Math.PI*2)*(i/n)+(opts.angle??0)+Math.random()*.4,v=(opts.speed??3.4)+Math.random()*1.6;
      parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(opts.lift??1.2),life:0,max:opts.life??36,c:colors[i%colors.length],w:opts.w??7,h:opts.h??3,r:Math.random()*6,dr:(Math.random()-.5)*.3,drop:opts.drop})}
    if(!raf)raf=requestAnimationFrame(tick)}
  function tick(){cx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life<p.max);
    for(const p of parts){p.life++;p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.vx*=.97;p.r+=p.dr;const o=1-p.life/p.max;cx.globalAlpha=o;cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);
      if(p.drop){cx.beginPath();cx.arc(0,0,p.w/2*(.6+o*.4),0,Math.PI*2);cx.fill()}else{cx.beginPath();cx.roundRect?cx.roundRect(-p.w/2,-p.h/2,p.w,p.h,p.h/2):cx.rect(-p.w/2,-p.h/2,p.w,p.h);cx.fill()}cx.restore()}
    cx.globalAlpha=1;raf=parts.length&&!document.hidden?requestAnimationFrame(tick):(cx.clearRect(0,0,innerWidth,innerHeight),0)}
  const COLORS=()=>{const st=getComputedStyle(document.documentElement);return["--cyan","--pink","--orange"].map(v=>st.getPropertyValue(v).trim()||"#ff3fb4")};
  const center=el=>{const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};
  /* de 10 interacties */
  const A={
    "pop-in":(el)=>{SND.pop();return el.animate(S.calm?[{opacity:0},{opacity:1}]:[{opacity:0,transform:`scale(${sc(.6)})`},{opacity:1,transform:`scale(${sc(1.06)})`,offset:.65},{opacity:1,transform:"scale(1)"}],{duration:S.calm?150:280,easing:S.calm?"linear":E.out})},
    "plop-out":(el,o={})=>{SND.plop();buzz(12);
      if(!S.calm&&o.drops!==false){const [x,y]=center(el);setTimeout(()=>emit(x,y,6,COLORS(),{speed:2.6,life:22,w:6,drop:true,lift:.6}),110)}
      return el.animate(S.calm?[{opacity:1},{opacity:0}]:[{transform:"scale(1,1)",opacity:1},{transform:"scale(1.05,.92)",opacity:1,offset:.3},{transform:"scale(1.1)",opacity:.6,offset:.6},{transform:"scale(1.14)",opacity:0}],{duration:S.calm?120:200,easing:E.inn,fill:"forwards"})},
    "press":(el)=>el.animate([{transform:"scale(1)"},{transform:`scale(${sc(.94)})`,offset:.35},{transform:`scale(${sc(1.03)})`,offset:.7},{transform:"scale(1)"}],{duration:180,easing:E.out}),
    "toggle":(el,o={})=>{SND.tick();const k=el.querySelector(".knob");if(!k)return;const on=o.on;return k.animate(S.calm?[]:[{transform:`translateX(${on?0:20}px)`},{transform:`translateX(${on?11:9}px) scaleX(1.15)`,offset:.5},{transform:`translateX(${on?22:-2}px)`,offset:.8},{transform:`translateX(${on?20:0}px)`}],{duration:200,easing:E.back})},
    "render-pop":(el)=>{SND.tink();const ring=el.querySelector(".ring");ring&&ring.animate([{opacity:0},{opacity:1,offset:.3},{opacity:0}],{duration:350});
      return S.calm?null:el.animate([{transform:"scale(1)"},{transform:`scale(${sc(.96)})`,offset:.25},{transform:`scale(${sc(1.02)})`,offset:.7},{transform:"scale(1)"}],{duration:350,easing:E.back})},
    "burst":(el)=>{SND.burst();buzz([10,40,10]);A.press(el);const ck=el.querySelector(".ck");ck&&ck.animate(S.calm?[{opacity:0},{opacity:1}]:[{transform:"scale(0)",opacity:0},{transform:"scale(1.2)",opacity:1,offset:.6},{transform:"scale(1)",opacity:1}],{duration:280,easing:E.back,fill:"forwards"});
      const [x,y]=center(el);emit(x,y,12,COLORS(),{spread:Math.PI*1.2,angle:-Math.PI*1.1,speed:4,life:38,lift:1.8})},
    "wobble":(el)=>{buzz(30);el.classList.add("err");setTimeout(()=>el.classList.remove("err"),1400);return S.calm?null:el.animate([0,-6,5,-3,2,0].map(x=>({transform:`translateX(${x}px)`})),{duration:300,easing:E.std})},
    "toast":(el,o={})=>o.out?el.animate([{opacity:1,transform:"scale(1)"},{opacity:0,transform:`scale(${sc(.96)})`}],{duration:200,easing:E.inn,fill:"forwards"}):(SND.pop(),el.animate(S.calm?[{opacity:0},{opacity:1}]:[{opacity:0,transform:`translateY(12px) scale(${sc(.9)})`},{opacity:1,transform:"none"}],{duration:280,easing:E.back})),
    "lift":(el,o={})=>el.animate(o.drop?[{transform:`scale(${sc(1.04)}) rotate(${1.5*amp()}deg)`},{transform:`scale(1,${sc(.96)})`,offset:.5},{transform:"none"}]:[{transform:"none"},{transform:`scale(${sc(1.04)}) rotate(${1.5*amp()}deg)`}],{duration:120,easing:E.out,fill:"forwards"}),
    "count":(el)=>S.calm?null:el.animate([{transform:`translateY(-4px) scale(${sc(1.15)})`},{transform:"none"}],{duration:120,easing:E.out})
  };
  function pop(el,name,o){cancel(el);const a=A[name]&&A[name](el,o||{});return a&&a.finished?a.finished.catch(()=>{}):Promise.resolve()}
  return {pop,S,save,SND,emit,COLORS};
